<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematical!</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon_32x32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="./assets/images/favicon_180x180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/favicon_180x180.png" />
    <link rel="stylesheet" href="./css/styles.css?v=3" />
  </head>
  <body>
    <main class="hero">
      <h1 class="hero-title">The fun will never end, it&rsquo;s Adventure Time!</h1>
      <section class="runner" data-state="loading" aria-label="Finn and Jake">
        <p class="runner-score" hidden>
          <span>Score <b id="score">000</b></span>
          <span>Best <b id="best-score">000</b></span>
        </p>
        <canvas class="runner-track" width="320" height="142" aria-label="Finn and Jake running along a track">
          This game needs a browser with Canvas support.
        </canvas>
        <p class="runner-status" role="status"></p>
      </section>
    </main>
    <script src="./js/script.js?v=3"></script>
  </body>
</html>
