    let frame = 0;
    let elapsed = 0;
    let lastTick = null;
    let animation = null;
    let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      if (background.checked) {
        context.fillStyle = "#2e9bd8";
        context.fillRect(0, 0, canvas.width, canvas.height);
      }
      for (const layer of layers) {
        if (!layer.toggle.checked) continue;
        const index = frame % layer.frames;
        const x = index % 4 * frameSize;
        const y = Math.floor(index / 4) * frameSize;
        context.drawImage(layer.image, x, y, frameSize, frameSize, 0, 0, canvas.width, canvas.height);
      }
    }

    function tick(now) {
      if (lastTick !== null) elapsed = (elapsed + now - lastTick) % (frameDuration * frameCount);
      lastTick = now;
      const nextFrame = Math.floor(elapsed / frameDuration);
      if (nextFrame !== frame) {
        frame = nextFrame;
        draw();
      }
      animation = requestAnimationFrame(tick);
    }

    function updatePlayback() {
      play.textContent = playing ? "Пауза" : "Продолжить";
      if (playing) {
        animation = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(animation);
        animation = null;
        lastTick = null;
      }
    }

    async function start() {
      context.imageSmoothingEnabled = false;
      await Promise.all(layers.map(async (layer) => {
        layer.toggle = document.getElementById(layer.id);
        layer.image = new Image();
        layer.image.src = layer.source;
        await layer.image.decode();
      }));
      for (const { toggle } of layers) toggle.addEventListener("change", draw);
      background.addEventListener("change", draw);
      play.addEventListener("click", () => {
        playing = !playing;
        updatePlayback();
      });
      draw();
      updatePlayback();
    }

    start().catch(() => {
      status.textContent = "Не удалось загрузить слои анимации.";
    });
  </script>
